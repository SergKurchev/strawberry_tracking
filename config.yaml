# Hyperparameters and paths for Strawberry Tracker system

# === Paths ===
# Path to the trained YOLOv8 model weights (.pt file)
yolo_weights_path: 'yolo_weights/best.pt'
# Root directory containing data (train/val/test images and annotations)
data_dir: 'Robo Strawberry.coco-segmentation/train'
# Directory to save processing results (videos, frames, logs)
output_dir: 'test_results'

# === YOLO Detection ===
# Confidence threshold: objects with probability below this will be ignored
yolo_conf: 0.2
# IoU threshold for NMS: used to remove overlapping boxes for the same object
iou_threshold: 0.45

# === Feature Matching (DISK + LightGlue) ===
# Maximum number of local features (points) extracted from a single frame via DISK
num_features: 4096
# If true, features are extracted from the whole frame (for SLAM/pose). If false - only inside strawberry boxes.
use_global_features: true
# Minimum number of matches between frames to confirm object association (ID)
match_threshold: 3

# === RANSAC / Camera Pose Recovery ===
# RANSAC success probability: affects the number of iterations (higher is more reliable but slower)
ransac_prob: 0.999
# Reprojection error threshold (in pixels): points with larger error are considered outliers
ransac_threshold: 3.0
# Solver algorithm: USAC_MAGSAC (modern and accurate), RANSAC, or LMEDS
pose_solver: "MAGSAC"
# Small motion threshold (in pixels): if average point displacement is less than this, camera is considered static
min_motion_thresh: 1.0

# === Tracking & Re-ID ===
# Time-To-Live (TTL) for objects in memory (in frames): how many frames to keep a strawberry after it disappears
gallery_ttl: 10

# === Test Settings ===
# Range of frames from the dataset to process in the test script
test_frame_range: [60, 70]

# === Camera Intrinsic Matrix (K) ===
camera:
  # Frame width in pixels
  width: 1920
  # Frame height in pixels
  height: 1080
  # Focal length in pixels
  focal_length: 1000.0
  # Optical center X coordinate (principal point x)
  center_x: 960.0
  # Optical center Y coordinate (principal point y)
  center_y: 540.0

# === General Settings ===
# Enables rendering of results (boxes, IDs, trajectories) on images
visualization_enabled: true
# If true, outputs detailed debug info to console (inliers, matches, statuses)
debug_mode: true
# Computation device: 'cuda' (NVIDIA GPU), 'cpu', or 'auto' (automatic selection)
device: 'auto'
